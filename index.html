<!DOCTYPE html>
<html lang="en" data-th="soft"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9e6f7">
<title>FF & Gmail Store</title>
<link rel="manifest" href="manifest.json"><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script>
<style>
:root{--bg:#e9e6f7;--bg2:#d9ecf2;--card:#f6f4ff;--bd:#ffffffcc;--tx:#2b2f4a;--mut:#74789a;--ac:#7c6cf0;--acd:#5a4bc7;--ok:#3aa981;--okd:#25805f;--rd:#e0627a;--rdd:#b8445a;--gm:#e8708a;
--sh:0 1px 0 #fff inset,0 14px 28px -12px #5a4bc760,0 3px 8px -2px #5a4bc728;--bf:none;--o1:#c7b8ff;--o2:#a8e6d7;--o3:#ffd0dc;--in:#ecebfa}
html[data-th=glass]{--bg:#0d1b2a;--bg2:#1b2a49;--card:#ffffff17;--bd:#ffffff33;--tx:#eef6ff;--mut:#a9bdd6;--ac:#6fb7ff;--acd:#3d86d6;--sh:0 1px 0 #ffffff55 inset,0 -1px 0 #ffffff12 inset,0 18px 40px -14px #000a;--bf:blur(22px) saturate(170%);--o1:#4f7cff;--o2:#18c6b0;--o3:#b66cff;--in:#ffffff12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 'Segoe UI',system-ui,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom));transition:background .5s}
.orbs{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:fl 14s ease-in-out infinite}
.orbs i:nth-child(1){width:60vmax;height:60vmax;background:var(--o1);top:-20vmax;left:-15vmax}
.orbs i:nth-child(2){width:50vmax;height:50vmax;background:var(--o2);bottom:-18vmax;right:-12vmax;animation-delay:-5s}
.orbs i:nth-child(3){width:34vmax;height:34vmax;background:var(--o3);top:40%;left:50%;animation-delay:-9s}
@keyframes fl{50%{transform:translate(6vmax,4vmax) scale(1.12)}}
header{position:sticky;top:0;z-index:5;margin:calc(8px + env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:22px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf)}
h1{font-size:17px;margin:0;letter-spacing:.3px}.me{display:flex;align-items:center;gap:8px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,var(--ac),var(--acd));color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 3px 0 var(--acd),0 8px 14px -4px #0004}
main{position:relative;max-width:680px;margin:0 auto;padding:14px}
button{font:inherit;border:0;border-radius:16px;padding:10px 16px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 80%,#fff),var(--ac));color:#fff;font-weight:600;cursor:pointer;box-shadow:0 4px 0 var(--acd),0 12px 18px -8px #0005,0 1px 0 #fff6 inset;transition:transform .12s,box-shadow .12s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acd),0 4px 8px -4px #0005}
button:disabled{opacity:.6}
button.s{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf)}
button.g{background:linear-gradient(160deg,#5fcfa6,var(--ok));box-shadow:0 4px 0 var(--okd),0 12px 18px -8px #0005}
button.r{background:linear-gradient(160deg,#f08a9f,var(--rd));box-shadow:0 4px 0 var(--rdd),0 12px 18px -8px #0005}
html[data-th=glass] button:not(.s):not(.g):not(.r){background:linear-gradient(160deg,#ffffff40,#6fb7ff80);border:1px solid #ffffff55;backdrop-filter:blur(10px)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding:4px 2px 8px}
.chips button{padding:8px 15px;border-radius:99px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;perspective:900px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf);animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.grid .card{margin:0;padding:9px;cursor:pointer;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s,box-shadow .2s;will-change:transform}
.grid .card:hover{box-shadow:var(--sh),0 24px 40px -16px #0005}
img.p{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;background:#0002;display:block;box-shadow:0 10px 18px -8px #0006}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--ac);color:#fff}.tag.Gmail{background:var(--gm)}
.mut{color:var(--mut);font-size:13px}.c{text-align:center}.price{font-weight:800;color:var(--ac)}
input,select,textarea{width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;margin:5px 0;box-shadow:inset 0 3px 8px #0000001c;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
select option{color:#222}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:2px;padding:6px;width:min(92vw,420px);border-radius:28px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh),0 20px 30px -12px #0005;backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf)}
.nav button{flex:1;background:none;color:var(--mut);box-shadow:none;border-radius:22px;padding:8px 2px;font-size:11px;position:relative;display:flex;flex-direction:column;align-items:center;transform:none}
.nav button span{font-size:20px;transition:transform .2s}
.nav button.on{color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 80%,#fff),var(--ac));box-shadow:0 3px 0 var(--acd),0 8px 14px -6px #0006}
.nav button.on span{transform:translateY(-2px) scale(1.15)}
.nav i{position:absolute;top:2px;right:18%;background:var(--rd);color:#fff;font-style:normal;font-size:10px;padding:1px 6px;border-radius:99px}
.modal{position:fixed;inset:0;z-index:9;background:#0008;backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--tx);width:100%;max-width:680px;border-radius:30px 30px 0 0;padding:18px;max-height:92vh;overflow:auto;position:relative;animation:up .35s;border:1px solid var(--bd)}
html[data-th=glass] .sheet{background:#14233bd9;backdrop-filter:var(--bf)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.x{position:absolute;top:12px;right:12px;padding:6px 12px}
.qr{width:230px;max-width:70%;display:block;margin:12px auto;background:#fff;border-radius:18px;padding:8px;box-shadow:0 14px 24px -10px #0006}
.big{max-height:260px;margin:10px 0}.zoom{width:100%;border-radius:16px}
pre{white-space:pre-wrap;word-break:break-all;background:var(--in);padding:12px;border-radius:14px;margin:8px 0;box-shadow:inset 0 3px 8px #0000001a}
.shot{max-width:100%;max-height:200px;border-radius:14px;display:block;margin:8px 0;cursor:zoom-in}
.b{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px}.b.pending{background:#f5a52433;color:#d98a0b}.b.confirmed{background:#3aa98133;color:var(--ok)}.b.rejected{background:#e0627a33;color:var(--rd)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}.stats .card{margin:0;text-align:center}.stats b{font-size:22px;display:block}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;background:var(--ok);color:#fff;padding:11px 18px;border-radius:16px;max-width:90%;box-shadow:0 12px 24px -8px #0006}.toast.bad{background:var(--rd)}
.sk{height:170px;border-radius:24px;background:var(--card);animation:p 1.2s infinite}@keyframes p{50%{opacity:.4}}
.hero h2{margin:6px 0}.hero .em{font-size:54px;display:block;animation:fl2 4s ease-in-out infinite}@keyframes fl2{50%{transform:translateY(-8px) rotateY(20deg)}}
.tg{padding:7px 12px;font-size:13px}
</style></head><body>
<div class="orbs"><i></i><i></i><i></i></div>
<header><h1>🌿 FF & Gmail Store</h1><div class="me" id="me"></div></header>
<main id="app"></main><div class="nav" id="nav"></div><div id="modal"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,addDoc,setDoc,getDoc,updateDoc,deleteDoc,onSnapshot,query,where}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyBRtbN4UfJfwUPT1tSJoVsQuoqW5f9-3p8",authDomain:"ffstore-84973.firebaseapp.com",projectId:"ffstore-84973",appId:"1:457072994201:web:e0dc375b2951ac8ce31508"};
const OWNER_EMAIL="studentpratyush2010@gmail.com"; // main owner (can add/remove other owners)
const OWNER_WA=""; // optional: "919876543210" (with country code) shows a "Chat with owner" button

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=s=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s||'')?s:'';
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN');
const when=t=>new Date(t).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
const LBL={pending:'⏳ Pending',confirmed:'✅ Confirmed',rejected:'❌ Rejected'};
let th='soft';try{th=localStorage.getItem('th')||'soft'}catch(e){}
document.documentElement.dataset.th=th;
const st={u:null,owner:false,main:false,owners:[],ready:false,tab:'shop',sub:'ord',cat:'All',q:'',ofil:'pending',hfil:'all',items:[],orders:[],qr:'',dirty:0};
let unsubs=[],ou=null;

function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const run=async(b,fn)=>{if(b.disabled)return;b.disabled=true;const o=b.textContent;b.textContent='⏳ ...';try{await fn()}catch(e){if(e!=='x')toast(e.message||String(e),1)}finally{if(b.isConnected){b.disabled=false;b.textContent=o}}};
const shrink=(f,max=800)=>new Promise((ok,no)=>{if(!f)return no(new Error('Please choose a photo / screenshot'));if(!f.type.startsWith('image/'))return no(new Error('Images only'));const r=new FileReader();r.onerror=()=>no(new Error('Could not read file'));r.onload=()=>{const i=new Image();i.onerror=()=>no(new Error('Image is corrupted'));i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.65))};i.src=r.result};r.readAsDataURL(f)});
const openModal=h=>{$('#modal').innerHTML=`<div class="modal"><div class="sheet"><button class="s x" data-act="closem">✕</button>${h}</div></div>`};
const closeModal=()=>$('#modal').innerHTML='';
const typing=()=>{const a=document.activeElement;return a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)&&a.id!=='q'};
const er=e=>toast('Data load error: '+(e.code||e.message),1);
const lc=s=>String(s||'').trim().toLowerCase();
const chkOwner=()=>!!st.u&&(lc(st.u.email)===lc(OWNER_EMAIL)||st.owners.includes(lc(st.u.email)));

function subOrders(){ou&&ou();const x=st.u;if(!x)return;
  const oq=st.owner?collection(db,'orders'):query(collection(db,'orders'),where('buyer','==',x.uid));
  ou=onSnapshot(oq,s=>{st.orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));render()},er)}

onAuthStateChanged(auth,x=>{
  unsubs.forEach(f=>f());unsubs=[];ou&&ou();ou=null;
  st.u=x;st.owners=[];st.owner=chkOwner();st.main=!!x&&lc(x.email)===lc(OWNER_EMAIL);st.ready=true;
  if(x){setDoc(doc(db,'users',x.uid),{name:x.displayName||'',email:x.email,last:Date.now()},{merge:true}).catch(()=>{});
    subOrders();
    unsubs.push(onSnapshot(collection(db,'items'),s=>{st.items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));render()},er));
    unsubs.push(onSnapshot(doc(db,'settings','qr'),s=>{st.qr=(s.data()||{}).img||'';render()},er));
    unsubs.push(onSnapshot(doc(db,'settings','owners'),s=>{st.owners=((s.data()||{}).list||[]).map(lc);const o=chkOwner();if(o!==st.owner){st.owner=o;subOrders()}render()},()=>{}));
  }else{st.items=[];st.orders=[];st.qr=''}
  render(true);
});
const login=async()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await signInWithPopup(auth,p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))return signInWithRedirect(auth,p);
    if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code))toast(e.message,1)}};

const chips=(list,cur,a)=>`<div class="chips">${list.map(([k,l])=>`<button class="${cur===k?'':'s'}" data-act="${a}" data-id="${k}">${l}</button>`).join('')}</div>`;
const empty=m=>`<div class="card mut c">${m}</div>`;

function render(force){
  if(!force&&typing()){st.dirty=1;return}
  st.dirty=0;const{u,owner,ready,tab}=st,A=$('#app');
  $('#me').innerHTML=`<button class="s tg" data-act="theme">${th==='soft'?'🫧 Glass':'🌸 Soft'}</button>`+(u?`<div class="av">${esc((u.displayName||u.email||'?')[0].toUpperCase())}</div><button class="s tg" data-act="out">Logout</button>`:'');
  if(!ready){A.innerHTML='<div class="grid"><div class="sk"></div><div class="sk"></div></div>';$('#nav').innerHTML='';return}
  if(!u){$('#nav').innerHTML='';A.innerHTML=`<div class="card c hero" style="margin-top:40px"><span class="em">🌿</span><h2>Welcome</h2><p class="mut">Sign in with Google to buy FF &amp; Gmail IDs, track your orders and place custom requests.</p><button data-act="login">Continue with Google</button></div>`;return}
  const pc=st.orders.filter(o=>o.status==='pending').length;
  const tabs=[['shop','🛍️','Shop'],['cust','✍️','Custom'],['my','📦','Orders']];if(owner)tabs.push(['adm','⚙️','Owner']);
  $('#nav').innerHTML=tabs.map(([k,ic,l])=>`<button class="${tab===k?'on':''}" data-act="tab" data-id="${k}"><span>${ic}</span>${l}${k==='adm'&&pc?`<i>${pc}</i>`:''}</button>`).join('');
  A.innerHTML=tab==='shop'?shop():tab==='cust'?cust():tab==='my'?hist():owner?admin():'';
}
const live=()=>st.items.filter(i=>!i.sold);
function grid(){const q=st.q.toLowerCase(),l=live().filter(i=>(st.cat==='All'||i.type===st.cat)&&(!q||(i.title+' '+(i.desc||'')).toLowerCase().includes(q)));
  return l.length?l.map(i=>`<div class="card" data-act="buy" data-id="${i.id}"><img class="p" src="${img(i.photo)}" alt=""><div style="margin:8px 0 3px"><span class="tag ${esc(i.type)}">${esc(i.type)}</span></div><b>${esc(i.title)}</b><div class="price">${money(i.price)}</div></div>`).join(''):empty('No items found.')}
const shop=()=>`<input id="q" placeholder="🔍 Search items" value="${esc(st.q)}">${chips([['All','All'],['FF','FF'],['Gmail','Gmail']],st.cat,'cat')}<div class="grid" id="grid">${grid()}</div>`;
const payBox=()=>st.qr?`<img class="qr" src="${img(st.qr)}"><input id="utr" placeholder="UTR / Transaction ID"><input id="sf" type="file" accept="image/*">`:'<p class="mut">The owner has not set a payment QR yet.</p>';
const cust=()=>`<div class="card"><b>✍️ Request something custom</b><p class="mut">Describe what you need (FF level, skins, Gmail age...). Pay your budget and upload the screenshot. The owner will confirm or reject.</p><textarea id="cr" rows="4" placeholder="What do you need?"></textarea><input id="cb" placeholder="Budget ₹" inputmode="numeric"><input id="cc" placeholder="Contact: WhatsApp / Telegram (optional)">${payBox()}<button data-act="cpay">Send request</button></div>`;
const ocard=(o,own)=>`<div class="card"><div class="row"><b>${esc(o.title)}</b><span class="b ${o.status}">${LBL[o.status]||''}</span></div><div class="mut">${money(o.price)} · ${when(o.ts)}</div>
${own?`<div class="mut">${esc(o.name)} · ${esc(o.email)}</div>`:''}${o.request?`<div>📝 ${esc(o.request)}</div>`:''}${own&&o.contact?`<div class="mut">📞 ${esc(o.contact)}</div>`:''}${o.utr?`<div class="mut">UTR: ${esc(o.utr)}</div>`:''}
${own&&img(o.shot)?`<img class="shot" src="${img(o.shot)}" data-act="zoom" data-id="${o.id}">`:''}${o.status==='rejected'&&o.note?`<div class="mut">${esc(o.note)}</div>`:''}
${o.status==='confirmed'&&o.delivery?`<pre>${esc(o.delivery)}</pre><button class="s" data-act="copy" data-id="${o.id}">📋 Copy</button>`:''}
${own&&o.status==='pending'?`<div class="row" style="margin-top:8px"><button class="g" data-act="ok" data-id="${o.id}">Confirm ✅</button><button class="r" data-act="rej" data-id="${o.id}">Reject</button></div>`:''}
${own&&o.status==='confirmed'?`<button class="s" data-act="fix" data-id="${o.id}">Edit delivery</button>`:''}</div>`;
function hist(){const m=st.orders.filter(o=>o.buyer===st.u.uid&&(st.hfil==='all'||o.status===st.hfil));
  return `${OWNER_WA?`<a href="https://wa.me/${esc(OWNER_WA)}" target="_blank"><button class="s" style="width:100%">💬 Chat with owner</button></a>`:''}${chips([['all','All'],['pending','Pending'],['confirmed','Confirmed'],['rejected','Rejected']],st.hfil,'hfil')}${m.length?m.map(o=>ocard(o,0)).join(''):empty('No orders yet.')}`}
function admin(){const o=st.orders,conf=o.filter(x=>x.status==='confirmed'),rev=conf.reduce((a,x)=>a+(Number(x.price)||0),0);
  const head=`<div class="stats"><div class="card"><b>${o.filter(x=>x.status==='pending').length}</b><span class="mut">Pending</span></div><div class="card"><b>${conf.length}</b><span class="mut">Confirmed</span></div><div class="card"><b>${money(rev)}</b><span class="mut">Revenue</span></div><div class="card"><b>${live().length}</b><span class="mut">Live items</span></div></div>${chips([['ord','Orders'],['itm','Items'],['own','Owners'],['set','QR']],st.sub,'sub')}`;
  if(st.sub==='ord'){const l=o.filter(x=>st.ofil==='all'||x.status===st.ofil);return head+chips([['pending','Pending'],['confirmed','Confirmed'],['rejected','Rejected'],['all','All']],st.ofil,'ofil')+(l.length?l.map(x=>ocard(x,1)).join(''):empty('No orders.'))}
  if(st.sub==='set')return head+`<div class="card"><b>Payment QR</b>${st.qr?`<img class="qr" src="${img(st.qr)}">`:''}<input id="qf" type="file" accept="image/*"><button data-act="qr">Save QR</button></div>`;
  if(st.sub==='own')return head+`<div class="card"><b>👑 Owners</b><p class="mut">Owners can manage orders, items and the QR. Only the main owner can add or remove owners.</p>
    <div class="row card" style="margin:8px 0"><span>${esc(OWNER_EMAIL)}</span><span class="tag">Main</span></div>
    ${st.owners.filter(e=>e!==lc(OWNER_EMAIL)).map(e=>`<div class="row card" style="margin:8px 0"><span style="word-break:break-all">${esc(e)}</span>${st.main?`<button class="r tg" data-act="delown" data-id="${esc(e)}">Remove</button>`:''}</div>`).join('')}
    ${st.main?`<input id="oe" type="email" placeholder="new.owner@gmail.com"><button data-act="addown">Add owner</button>`:'<p class="mut">Only the main owner can edit this list.</p>'}</div>`;
  return head+`<div class="card"><b>New item</b><select id="ty"><option>FF</option><option>Gmail</option></select><input id="ti" placeholder="Title"><input id="pr" placeholder="Price ₹" inputmode="numeric"><textarea id="de" rows="2" placeholder="Description (optional)"></textarea><input id="ph" type="file" accept="image/*"><input id="se" placeholder="Secret data (required, delivered after confirmation)"><button data-act="add">Upload</button></div>`+
  st.items.map(i=>`<div class="card"><div class="row"><b>${esc(i.title)}</b><span class="b ${i.sold?'rejected':'confirmed'}">${i.sold?'Sold':'Live'}</span></div><div class="mut">${esc(i.type)} · ${money(i.price)}</div><div class="row" style="margin-top:8px"><button class="s tg" data-act="price" data-id="${i.id}">Price</button><button class="s tg" data-act="sec" data-id="${i.id}">Secret</button><button class="s tg" data-act="sold" data-id="${i.id}">${i.sold?'Make live':'Mark sold'}</button><button class="r tg" data-act="del" data-id="${i.id}">Delete</button></div></div>`).join('')}
function buyModal(i){const dup=st.orders.find(o=>o.buyer===st.u.uid&&o.itemId===i.id&&o.status!=='rejected');
  openModal(`<b>${esc(i.title)}</b> <span class="tag ${esc(i.type)}">${esc(i.type)}</span><img class="p big" src="${img(i.photo)}" alt=""><p>${esc(i.desc||'')}</p><h3 class="price">${money(i.price)}</h3>${dup?`<p class="mut">Your order for this item is ${LBL[dup.status]}. Check the Orders tab.</p>`:`<p class="mut">1) Pay ${money(i.price)} via QR &nbsp;2) Enter UTR &nbsp;3) Upload screenshot</p>${payBox()}${st.qr?`<button data-act="pay" data-id="${i.id}">Submit payment</button>`:''}`}`)}
const newOrder=async(extra,shot)=>addDoc(collection(db,'orders'),{buyer:st.u.uid,name:st.u.displayName||'',email:st.u.email,utr:($('#utr')?.value||'').trim(),shot,status:'pending',ts:Date.now(),...extra});
const ref=(c,id)=>doc(db,c,id),ord=id=>st.orders.find(o=>o.id===id);

async function confirmOrder(o){
  if(!confirm('Have you verified the payment? Confirm this order?'))throw'x';
  if(o.kind==='custom'){const d=prompt('Enter what the buyer should receive (or a reply):')||'';if(!d)throw'x';return updateDoc(ref('orders',o.id),{status:'confirmed',delivery:d})}
  const it=st.items.find(i=>i.id===o.itemId);if(!it)throw new Error('This item has been deleted');
  if(it.sold&&!confirm('This item is already sold. Confirm anyway?'))throw'x';
  let v=((await getDoc(ref('secrets',o.itemId))).data()||{}).v||'';
  if(!v){v=prompt('Secret data is empty. Enter what the buyer should receive:')||'';if(!v)throw'x';await setDoc(ref('secrets',o.itemId),{v})}
  await updateDoc(ref('orders',o.id),{status:'confirmed',delivery:v});await updateDoc(ref('items',o.itemId),{sold:true});
  for(const x of st.orders.filter(x=>x.itemId===o.itemId&&x.id!==o.id&&x.status==='pending'))await updateDoc(ref('orders',x.id),{status:'rejected',note:'This item has been sold. Contact the owner for a refund.'});
  toast('Order confirmed ✅');
}
const saveOwners=l=>setDoc(ref('settings','owners'),{list:[...new Set(l.map(lc))]});
function act(a,d,b){
  const S={tab:()=>{st.tab=d.id;render(true)},cat:()=>{st.cat=d.id;render(true)},sub:()=>{st.sub=d.id;render(true)},ofil:()=>{st.ofil=d.id;render(true)},hfil:()=>{st.hfil=d.id;render(true)},
    theme:()=>{th=th==='soft'?'glass':'soft';document.documentElement.dataset.th=th;try{localStorage.setItem('th',th)}catch(e){}
      document.querySelector('meta[name=theme-color]').content=th==='soft'?'#e9e6f7':'#0d1b2a';render(true)},
    login,out:()=>signOut(auth),closem:closeModal,buy:()=>{const i=st.items.find(x=>x.id===d.id);i&&buyModal(i)},
    zoom:()=>{const o=ord(d.id);o&&openModal(`<img class="zoom" src="${img(o.shot)}">`)},
    copy:()=>navigator.clipboard.writeText(ord(d.id).delivery).then(()=>toast('Copied'),()=>toast('Copy failed',1))};
  if(S[a])return S[a]();
  const R={
    pay:async()=>{const i=st.items.find(x=>x.id===d.id);if(!i||i.sold)throw new Error('This item is no longer available');
      await newOrder({kind:'item',itemId:i.id,title:i.title,price:i.price},await shrink($('#sf').files[0]));closeModal();st.tab='my';render(true);toast('Order submitted ✅')},
    cpay:async()=>{const r=$('#cr').value.trim(),p=Number($('#cb').value);if(r.length<5||!(p>0))throw new Error('Enter your request and a valid budget');
      await newOrder({kind:'custom',title:'Custom: '+r.slice(0,40),request:r,contact:$('#cc').value.trim(),price:p},await shrink($('#sf').files[0]));st.tab='my';render(true);toast('Custom request sent ✅')},
    ok:()=>confirmOrder(ord(d.id)),
    rej:async()=>{const n=prompt('Reason for rejection (shown to buyer):');if(n===null)throw'x';await updateDoc(ref('orders',d.id),{status:'rejected',note:n})},
    fix:async()=>{const o=ord(d.id),v=prompt('Data shown to the buyer:',o.delivery||'');if(v===null)throw'x';await updateDoc(ref('orders',d.id),{delivery:v});if(o.kind!=='custom'){await setDoc(ref('secrets',o.itemId),{v});await updateDoc(ref('items',o.itemId),{sold:true}).catch(()=>{})}},
    qr:async()=>{await setDoc(ref('settings','qr'),{img:await shrink($('#qf').files[0],600)});toast('QR saved')},
    addown:async()=>{const e=lc($('#oe').value);if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))throw new Error('Enter a valid email');
      if(e===lc(OWNER_EMAIL)||st.owners.includes(e))throw new Error('Already an owner');await saveOwners([...st.owners,e]);toast('Owner added 👑')},
    delown:async()=>{if(!confirm('Remove '+d.id+' as owner?'))throw'x';await saveOwners(st.owners.filter(e=>e!==d.id));toast('Owner removed')},
    add:async()=>{const t=$('#ti').value.trim(),p=Number($('#pr').value),sec=$('#se').value.trim();if(!t||!(p>0))throw new Error('Enter a title and a valid price');if(!sec)throw new Error('Secret data is required');
      const photo=await shrink($('#ph').files[0],700);
      const r=await addDoc(collection(db,'items'),{type:$('#ty').value,title:t,price:p,desc:$('#de').value.trim(),photo,sold:false,ts:Date.now()});
      try{await setDoc(ref('secrets',r.id),{v:sec})}catch(e){await deleteDoc(ref('items',r.id));throw e}
      ['ti','pr','de','se','ph'].forEach(k=>$('#'+k).value='');toast('Item uploaded ✅')},
    price:async()=>{const p=Number(prompt('New price ₹:'));if(!(p>0))throw'x';await updateDoc(ref('items',d.id),{price:p})},
    sec:async()=>{const v=prompt('New secret data:');if(!v)throw'x';await setDoc(ref('secrets',d.id),{v});toast('Secret saved')},
    sold:()=>updateDoc(ref('items',d.id),{sold:!st.items.find(i=>i.id===d.id).sold}),
    del:async()=>{if(!confirm('Delete this item?'))throw'x';await deleteDoc(ref('items',d.id));await deleteDoc(ref('secrets',d.id))}};
  if(R[a])run(b,R[a]);
}
document.addEventListener('click',e=>{if(e.target.classList.contains('modal'))return closeModal();const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset,b)});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;$('#grid').innerHTML=grid()}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(st.dirty&&!typing())render(true)},250));
// 3D tilt on product cards
document.addEventListener('pointermove',e=>{const c=e.target.closest('.grid .card');if(!c||e.pointerType==='touch')return;const r=c.getBoundingClientRect();
  c.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*14+'deg');c.style.setProperty('--rx',(.5-(e.clientY-r.top)/r.height)*14+'deg')});
document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.grid .card');if(c){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
render(true);
</script></body></html>
